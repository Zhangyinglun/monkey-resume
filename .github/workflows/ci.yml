name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monkey-resume
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: monkey-resume
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils fonts-crosextra-carlito
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.python-version == '3.12'
        run: skills-ref validate "${{ github.workspace }}/monkey-resume"
      - run: ruff check scripts templates tests
      - run: python -m unittest discover -s tests -v
        env:
          # Arial is separately licensed and is not provisioned on this runner.
          # Exercise real Carlito rendering; the Arial test reports its own skip.
          MONKEY_RESUME_TEST_STYLE: professional-v2
